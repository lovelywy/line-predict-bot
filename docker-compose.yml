services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: predictbot
      POSTGRES_PASSWORD: predictbot
      POSTGRES_DB: predictbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictbot -d predictbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://predictbot:predictbot@postgres:5432/predictbot
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:

services:
  - type: web
    name: line-predict-bot
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: predictbot-db
          property: connectionString
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: BOOTSTRAP_ADMIN_KEY
        sync: false
      - key: STARTING_POINTS
        value: "1000"
      - key: DAILY_BONUS_POINTS
        value: "100"
      - key: LINE_DRY_RUN
        value: "false"
      - key: NODE_ENV
        value: production

databases:
  - name: predictbot-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: predictbot_db
    user: predictbot_db_user
